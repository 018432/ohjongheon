<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기호 2번 2년의 약속</title>
<meta property="og:title" content="기호 2번 오종헌·최국록·박상민">
<meta property="og:description" content="2년의 약속, 들어보실래요? 성과는 더 크게! 변화는 더 새롭게!">
<meta property="og:image" content="https://018432.github.io/ohjongheon/yaksok/poster.jpg">
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#0d1712;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
video{position:fixed;inset:0;width:100%;height:100%;height:100dvh;object-fit:contain;background:#0d1712;display:block}
.btn{border:0;cursor:pointer;font:700 15px/1 inherit;font-family:inherit;border-radius:30px;padding:12px 18px;-webkit-tap-highlight-color:transparent;text-decoration:none;white-space:nowrap}
#snd{position:fixed;z-index:5;right:12px;top:12px;background:rgba(255,255,255,.92);color:#143628;box-shadow:0 4px 14px rgba(0,0,0,.3);transition:opacity .4s,padding .3s}
#snd.mini{opacity:.55;padding:9px 11px;font-size:16px}
#end b{color:#bfe38a}
#play{position:fixed;z-index:6;inset:0;margin:auto;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.9);display:none;padding:0}
#play:before{content:"";display:block;margin-left:36px;border-left:30px solid #1f5a40;border-top:18px solid transparent;border-bottom:18px solid transparent;width:0;height:0}
#end{position:fixed;z-index:7;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(13,23,18,.82);text-align:center;color:#fff;padding:24px}
#end h2{margin:0 0 6px;font-size:21px;line-height:1.45;word-break:keep-all}
#end .main{background:#f3b81e;color:#143628;font-size:18px;padding:16px 26px}
#end .sub{background:rgba(255,255,255,.14);color:#fff}
#end small{opacity:.7;font-size:13px}
</style></head>
<body>
<video id="v" src="video.mp4" poster="poster.jpg" autoplay muted playsinline webkit-playsinline preload="auto"></video>
<button class="btn" id="snd" type="button">🔊 소리 켜기</button>
<button class="btn" id="play" type="button" aria-label="재생"></button>
<div id="end">
 <h2><b>기호 2번</b> 오종헌 · 최국록 · 박상민<br>2년의 약속, 공약집에서 확인하세요</h2>
 <a class="btn main" href="../">📖 공약집 보러 가기</a>
 <button class="btn sub" id="again" type="button">↻ 영상 다시 보기</button>
 <small id="cd"></small>
</div>
<script>
(function(){
  var v=document.getElementById('v'),s=document.getElementById('snd'),pl=document.getElementById('play'),
      end=document.getElementById('end'),again=document.getElementById('again'),cd=document.getElementById('cd'),t=null,n=0;
  function label(){s.textContent=v.muted?'🔊 소리 켜기':(s.classList.contains('mini')?'🔇':'🔇 소리 끄기')}
  function tryPlay(){var p=v.play();if(p&&p.catch)p.catch(function(){pl.style.display='block'})}
  /* 소리 버튼은 위쪽 빈 공간이 있으면 영상 밖에 표시 */
  function place(){
    var W=innerWidth,H=innerHeight,vw=v.videoWidth||720,vh=v.videoHeight||1280,
        sc=Math.min(W/vw,H/vh),dh=vh*sc,gap=(H-dh)/2;
    if(gap>=56){s.style.top=Math.max(8,(gap-44)/2)+'px'}else{s.style.top='12px'}
  }
  function restart(){clearInterval(t);end.style.display='none';v.currentTime=0;tryPlay()}
  v.addEventListener('ended',function(){
    pl.style.display="none";end.style.display="flex";n=8;cd.textContent=n+'초 뒤 영상이 다시 재생됩니다';
    t=setInterval(function(){n--;cd.textContent=n+'초 뒤 영상이 다시 재생됩니다';if(n<=0)restart()},1000);
  });
  again.addEventListener('click',restart);
  s.addEventListener('click',function(e){e.stopPropagation();v.muted=!v.muted;if(v.paused)tryPlay();
    if(!v.muted)setTimeout(function(){s.classList.add('mini');label()},2500);else s.classList.remove('mini');label()});
  pl.addEventListener('click',function(){pl.style.display='none';v.play()});
  v.addEventListener('click',function(){if(v.paused){pl.style.display='none';v.play()}else{v.muted=!v.muted;label()}});
  v.addEventListener('playing',function(){pl.style.display='none'});
  v.addEventListener('loadedmetadata',place);addEventListener('resize',place);
  place();tryPlay();label();
})();
</script>
</body></html>
