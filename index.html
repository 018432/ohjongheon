html,body{margin:0;height:100%}
body{background:var(--stage);font-family:var(--f-body);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100%;-webkit-text-size-adjust:100%}
.card{position:relative;width:100vw;height:100vh;height:100svh;min-height:520px;background:#fff;overflow:hidden;display:flex;flex-direction:column;font-size:min(calc(100vw / 21), 3.1vh, 23px)}
@media (min-width:520px){.card{width:min(480px, calc(94vh / 1.75));height:min(94vh, 840px);border-radius:18px;box-shadow:0 10px 40px rgba(10,30,20,.18);font-size:calc(min(480px, 94vh / 1.75) / 21)}}
.top{position:relative;flex:none;padding:max(2.2em,env(safe-area-inset-top)) 1.6em 0}
.art{position:relative;flex:1;min-height:0;container-type:size;margin-top:.8em}
.pic{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(100cqw, 140.8cqh);aspect-ratio:1200/852}
.pill{display:inline-block;font-size:.62em;font-weight:700;letter-spacing:.06em;color:var(--g7);background:var(--g1);border:1px solid var(--g2);border-radius:2em;padding:.35em 1em}
.no{position:absolute;right:1.4em;top:max(1.6em,env(safe-area-inset-top));z-index:3;text-align:center;line-height:1}
.no small{display:block;font-family:var(--f-head);font-weight:900;font-size:.62em;color:var(--g7);letter-spacing:.2em;margin-bottom:.1em}
.no b{display:block;font-family:var(--f-head);font-weight:900;font-size:4.6em;color:var(--g7);text-shadow:.05em .05em 0 var(--lime)}
h1{font-family:var(--f-head);font-weight:900;font-size:2.05em;line-height:1.22;letter-spacing:-.03em;color:var(--g9);margin:1.05em 0 0}
h1 span{color:var(--g5)}
.dots{display:inline-flex;gap:.18em;margin-left:.12em;vertical-align:.12em}
.dots i{width:.2em;height:.2em;border-radius:50%;background:var(--g5);animation:b 1.4s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-.12em)}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.8}}
.lead{margin:.9em 0 0;font-size:.74em;line-height:1.7;color:var(--muted);font-weight:600}
.slogan{margin:1.1em 0 0;padding-top:.8em;border-top:1px solid var(--g2);font-family:var(--f-head);font-weight:700;font-size:.78em;line-height:1.5;color:var(--g7)}
.slogan em{font-style:normal;display:block;margin-top:.25em;font-weight:900;font-size:.82em;color:var(--g5);letter-spacing:.02em}
.ground{position:absolute;left:0;right:0;bottom:0;height:calc(min(100cqw, 140.8cqh) * .2);background:var(--g7)}
.photo{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{position:absolute;bottom:.75em;font-size:calc(min(100cqw, 140.8cqh) / 21);transform:translateX(-50%);text-align:center;white-space:nowrap;line-height:1.2;background:#fff;border-radius:.45em;padding:.28em .6em .32em;box-shadow:0 2px 8px rgba(0,0,0,.22);z-index:2}
.tag small{display:block;font-size:.42em;font-weight:700;color:var(--g5)}
.tag b{display:block;font-family:var(--f-head);font-weight:900;font-size:.78em;color:var(--g9)}
</style>
</head>
