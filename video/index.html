<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기호 2번 오종헌·최국록·박상민</title>
<meta property="og:title" content="기호 2번 오종헌·최국록·박상민">
<meta property="og:description" content="성과는 더 크게! 변화는 더 새롭게!">
<meta property="og:image" content="poster.jpg">
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#0d1712;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
video{width:100%;height:100%;height:100dvh;object-fit:contain;background:#0d1712;display:block}
.btn{position:fixed;z-index:5;border:0;cursor:pointer;font:700 15px/1 inherit;font-family:inherit;border-radius:30px;padding:12px 18px;-webkit-tap-highlight-color:transparent}
#snd{right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));background:rgba(255,255,255,.92);color:#143628;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#go{left:50%;transform:translateX(-50%);bottom:max(22px,env(safe-area-inset-bottom));background:#1f5a40;color:#fff;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.35);white-space:nowrap}
#go b{color:#bfe38a}
#play{position:fixed;inset:0;margin:auto;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.9);display:none;align-items:center;justify-content:center}
#play:before{content:"";margin-left:8px;border-left:30px solid #1f5a40;border-top:18px solid transparent;border-bottom:18px solid transparent}
</style></head>
<body>
<video id="v" src="video.mp4" poster="poster.jpg" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>
<button class="btn" id="snd" type="button">🔊 소리 켜기</button>
<button class="btn" id="play" type="button" aria-label="재생"></button>
<a class="btn" id="go" href="../"><b>기호 2번</b> 공약집 보러 가기 →</a>
<script>
(function(){
  var v=document.getElementById('v'),s=document.getElementById('snd'),pl=document.getElementById('play');
  function label(){s.textContent=v.muted?'🔊 소리 켜기':'🔇 소리 끄기'}
  function tryPlay(){var p=v.play();if(p&&p.catch)p.catch(function(){pl.style.display='flex'})}
  s.addEventListener('click',function(){v.muted=!v.muted;if(v.paused)v.play();label()});
  pl.addEventListener('click',function(){pl.style.display='none';v.play()});
  v.addEventListener('click',function(){if(v.paused){pl.style.display='none';v.play()}else{v.muted=!v.muted;label()}});
  v.addEventListener('playing',function(){pl.style.display='none'});
  tryPlay();label();
})();
</script>
</body></html>
